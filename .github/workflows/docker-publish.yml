name: Ionic Vue Docker

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Docker Image
        run: docker build -t cedricbakin06/ionic-vue-firebase-crud:latest .

      - name: Push Docker Image
        run: docker push cedricbakin06/ionic-vue-firebase-crud:latest