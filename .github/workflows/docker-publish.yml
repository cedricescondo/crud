name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: docker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 1. Get the latest source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Check Docker installation
      - name: Check Docker
        run: docker --version

      # 3. Build the Ionic Vue application image
      - name: Build Docker Image
        run: docker build --pull -t cedricbakin06/ionic-vue-firebase-crud:${{ github.sha }} -t cedricbakin06/ionic-vue-firebase-crud:latest .

      # 4. Push the immutable commit tag and the convenient latest tag
      - name: Push Commit Image
        run: docker push cedricbakin06/ionic-vue-firebase-crud:${{ github.sha }}

      - name: Push Latest Image
        run: docker push cedricbakin06/ionic-vue-firebase-crud:latest

      # 5. Pull the exact image built for this commit before removing the old container
      - name: Pull Commit Image
        run: docker pull cedricbakin06/ionic-vue-firebase-crud:${{ github.sha }}

      # 6. Remove the old container, whether it is running or stopped
      - name: Remove Existing Container
        shell: powershell
        run: |
          $container = docker ps -aq --filter "name=^ionic-vue-app$"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not find the existing container."
          }
          if ($container) {
            docker rm --force $container
            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove the existing container."
            }
          }

      # 7. Run the exact image built for this commit
      - name: Run Updated Container
        run: docker run -d -p 8080:80 --name ionic-vue-app --restart unless-stopped cedricbakin06/ionic-vue-firebase-crud:${{ github.sha }}

      # 8. Verify the deployed image and wait for the app to respond
      - name: Verify Deployment
        shell: powershell
        run: |
          $expectedImage = "cedricbakin06/ionic-vue-firebase-crud:${{ github.sha }}"
          $actualImage = docker inspect --format "{{.Config.Image}}" ionic-vue-app
          if ($LASTEXITCODE -ne 0 -or $actualImage -ne $expectedImage) {
            throw "The running container is not using the image built for this commit."
          }

          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8080/" -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                Write-Host "Deployment is serving the expected image."
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          throw "The container is running the expected image, but the app did not respond successfully on port 8080."
